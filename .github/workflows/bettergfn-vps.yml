name: Windows VPS - BetterGFN with Sunshine

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Thời gian chạy (tối đa 355 phút)"
        required: false
        default: "355"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  bettergfn-deploy:
    runs-on: windows-latest
    timeout-minutes: 370
    env:
      RDP_USER: Kandagawa
      RDP_PASS: Kandagw@12345
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --- 1. Tạo User & Mở Toàn Bộ Cổng Firewall ---
      - name: 🔓 Cấu hình hệ thống & Firewall
        run: |
          Write-Host "🔧 1. Tạo User và mở Firewall..."
          $u = $env:RDP_USER; $p = $env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group "Administrators" -Member $u
          }
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

          # Ép độ phân giải màn hình ảo 1080p
          Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Hoàn tất cấu hình hệ thống!"

      # --- 2. Cài đặt & Khởi tạo Sunshine Đúng Chuẩn ---
      - name: ☀️ Cài đặt & Kích hoạt Sunshine Stream Host (47989)
        run: |
          Write-Host "📥 1. Đang tải Sunshine MSI..."
          $sunshineUrl = "https://github.com/LizardByte/Sunshine/releases/download/v2026.1106.201906/Sunshine-Windows-AMD64-installer.msi"
          $msiPath = "$env:TEMP\Sunshine.msi"
          Invoke-WebRequest -Uri $sunshineUrl -OutFile $msiPath -TimeoutSec 180

          Write-Host "🚀 2. Đang cài đặt Sunshine qua msiexec..."
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msiPath`" /quiet /norestart"
          Start-Sleep -Seconds 5

          # Tìm file sunshine.exe
          $sunshineExe = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshineExe)) {
            $found = Get-ChildItem -Path "C:\Program Files" -Filter "sunshine.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $sunshineExe = $found.FullName }
          }

          if ($sunshineExe) {
            Write-Host "🔑 3. Tạo tài khoản cấu hình cho Sunshine..."
            # Cấu hình tài khoản admin ngầm không cần mở Web UI
            Start-Process -FilePath $sunshineExe -ArgumentList "--creds admin Kandagw@12345" -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue

            Write-Host "⚡ 4. Khởi chạy Sunshine Service ngầm..."
            Start-Process -FilePath $sunshineExe -WindowStyle Hidden
          }

          # Đợi Sunshine mở cổng 47989
          $sunshineReady = $false
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            Start-Sleep -Seconds 2
            $test = Test-NetConnection -ComputerName "127.0.0.1" -Port 47989 -WarningAction SilentlyContinue
            if ($test.TcpTestSucceeded) {
              $sunshineReady = $true
              Write-Host "✅ Sunshine đã sẵn sàng lắng nghe tại cổng 47989!"
              break
            }
            Write-Host "⏳ Đang đợi Sunshine khởi tạo... ($attempt/15)"
          }

          if (-not $sunshineReady) {
            Write-Warning "⚠️ Cổng 47989 phản hồi chậm, tiếp tục tiến trình..."
          }

      # --- 3. Cài đặt các ứng dụng song song ngầm ---
      - name: ⚡ Cài đặt VS Code & Discord ngầm
        run: |
          Start-Process powershell -WindowStyle Hidden -ArgumentList "-NoProfile -Command", {
            try {
              Invoke-WebRequest -Uri "https://update.code.visualstudio.com/latest/win32-x64/stable" -OutFile "$env:TEMP\VSCode.exe" -TimeoutSec 120
              Start-Process -FilePath "$env:TEMP\VSCode.exe" -ArgumentList "/verysilent /norestart /MERGETASKS=!runcode,addtopath,desktopicon" -Wait
            } catch {}
            try {
              Invoke-WebRequest -Uri "https://discord.com/api/download?platform=win" -OutFile "$env:TEMP\Discord.exe" -TimeoutSec 120
              Start-Process -FilePath "$env:TEMP\Discord.exe" -ArgumentList "-s" -Wait
            } catch {}
          }
          Write-Host "✅ VS Code & Discord đang cài đặt ngầm..."

      # --- 4. Khởi chạy BetterGFN Host & Cloudflare WSS Tunnel ---
      - name: 🚀 Khởi chạy BetterGFN Tunnel & Cloudflare WSS
        run: |
          Write-Host "=========================================================="
          Write-Host "  KHỞI ĐỘNG BETTERGFN TUNNEL HOST..."
          Write-Host "=========================================================="

          $gfnDir = "C:\BetterGFN"
          New-Item -ItemType Directory -Path $gfnDir -Force | Out-Null
          $gfnExe = "$gfnDir\BetterGFN-Tunnel-Release.exe"

          # Tải BetterGFN Host
          $downloadUrl = "https://github.com/kmille36/Better-Geforce-Now-Android/releases/download/2.2.0/BetterGFN-Tunnel-Release.exe"
          try {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $gfnExe -TimeoutSec 120
          } catch {
            Invoke-WebRequest -Uri "https://2z2.top/download/BetterGFN-Tunnel-Release.exe" -OutFile $gfnExe -TimeoutSec 120
          }

          # Khởi động BetterGFN Host
          Set-Location $gfnDir
          Start-Process -FilePath $gfnExe -RedirectStandardOutput "$gfnDir\host.log" -RedirectStandardError "$gfnDir\host_err.log" -WindowStyle Hidden
          Start-Sleep -Seconds 6

          # Mở Cloudflare Tunnel với cấu hình chuẩn WebSocket (HTTP/2 & Edge-IP auto)
          Write-Host "[+] Đang mở Cloudflare WSS Tunnel cho port 8080..."
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe" -TimeoutSec 60
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url http://localhost:8080 --logfile cloudflared.log --no-autoupdate --protocol http2" -WindowStyle Hidden

          # Bắt link Cloudflare và chuẩn hóa thành wss://
          $wssUrl = ""
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "cloudflared.log") {
              $log = Get-Content "cloudflared.log" -Raw -ErrorAction SilentlyContinue
              if ($log -match 'https://([a-zA-Z0-9-]+\.trycloudflare\.com)') {
                $rawDomain = $matches[1]
                # Bắt buộc dùng wss:// để không bị lỗi HTTP 301 Redirect của Cloudflare
                $wssUrl = "wss://$rawDomain"
                break
              }
            }
            Write-Host "⏳ Đang kết nối Cloudflare WSS... ($i/30)"
          }

          if (-not $wssUrl) {
            Write-Host "❌ Lỗi tạo link! Log:"
            Get-Content "cloudflared.log" -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================================="
          Write-Host "🎉 THÔNG TIN KẾT NỐI VÀO APP BETTERGFN (ĐÃ FIX WS ERROR):"
          Write-Host "👉 LINK 1 (KHUYÊN DÙNG - BẢO MẬT WSS): $wssUrl"
          Write-Host "👉 LINK 2 (DỰ PHÒNG NẾU APP BẮT BUỘC WS): $($wssUrl -replace 'wss://', 'ws://')"
          Write-Host "=========================================================="
          Write-Host ""

          $summary = "## 🎮 BetterGFN Remote Streaming Sẵn Sàng!`n`n" +
                     "👉 **Dán đường link dưới đây vào app BetterGFN trên điện thoại:**`n" +
                     "```text`n$wssUrl`n````n`n" +
                     "* Đã sửa lỗi: Tự động dùng chuẩn WSS (WebSocket Secure)`n" +
                     "* Đã kích hoạt: Sunshine Host (47989)"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Trở về workspace trước khi commit Git
          Set-Location $env:GITHUB_WORKSPACE
          try {
            $wssUrl | Out-File -FilePath "bettergfn-url.txt" -Encoding UTF8
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git add bettergfn-url.txt 2>$null
            git commit -m "🔗 Cập nhật BetterGFN URL: $wssUrl" --allow-empty 2>$null
            git push origin main --force 2>$null
          } catch {}

          $LASTEXITCODE = 0
          "BETTERGFN_WS_URL=$wssUrl" | Out-File -Append $env:GITHUB_ENV

      # --- 5. Duy trì phiên hoạt động ---
      - name: ⏳ Giữ VPS sống
        run: |
          $mins = [int]"${{ github.event.inputs.runtime_minutes }}"
          if ($mins -lt 10 -or $mins -gt 355) { $mins = 355 }
          $end = (Get-Date).AddMinutes($mins)
          $i = 0

          Write-Host "🟢 BetterGFN + Sunshine đang stream. Thời gian duy trì: $mins phút."
          
          while ((Get-Date) -lt $end) {
            $i++
            $left = $end - (Get-Date)
            $leftStr = if ($left.TotalSeconds -gt 0) { $left.ToString('hh\:mm\:ss') } else { '00:00:00' }
            Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] Heartbeat #$i | Còn lại: $leftStr | URL: $env:BETTERGFN_WS_URL"
            Start-Sleep -Seconds 60
          }

      # --- 6. Tự động Restart phiên mới (Tự nhận diện Workflow ID) ---
      - name: 🔄 Tự động Restart phiên mới
        if: always()
        run: |
          $now = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          Write-Host "🔁 Khởi động phiên mới tại: $now"

          if (-not $env:GH_TOKEN) {
            Write-Host "⚠️ Không có GH_TOKEN, dừng phiên."
            exit 0
          }

          try {
            $headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $payload = @{ ref = "${{ github.ref_name }}" } | ConvertTo-Json

            $runInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" -Headers $headers -TimeoutSec 15
            $wfId = $runInfo.workflow_id
            Write-Host "🎯 Tự động phát hiện Workflow ID: $wfId"

            Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wfId/dispatches" -Method Post -Headers $headers -Body $payload -TimeoutSec 30
            Write-Host "✅ Đã trigger phiên tiếp theo thành công!"
          } catch {
            Write-Warning "Lỗi trigger: $($_.Exception.Message)"
          }
